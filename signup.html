
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sign Up | Daily Planner</title>

    <link rel="stylesheet" href="login.css">

    <style>
        .password-wrapper {
            position: relative;
            width: 100%;
        }

        .password-wrapper input {
            width: 100%;
            padding-right: 48px;
            box-sizing: border-box;
        }

        .toggle-password {
            position: absolute;
            top: 50%;
            right: 12px;
            transform: translateY(-50%);
            width: 28px;
            height: 28px;
            padding: 4px;
            border: none;
            background: transparent;
            color: #6477A8;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 2;
        }

        .toggle-password svg {
            width: 21px;
            height: 21px;
            stroke: currentColor;
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .toggle-password:focus {
            outline: none;
        }
    </style>
</head>

<body class="signup-page">

    <main class="signup-container">

        <section class="signup-card">

            <div class="signup-brand">
                <div class="signup-icon">📅</div>
                <h1>Daily Planner</h1>
                <p>Organize your day, one task at a time.</p>
            </div>

            <div class="signup-heading">
                <span class="signup-label">GET STARTED</span>
                <h2>Create Account</h2>
                <p>Create your account and start planning your day.</p>
            </div>

            <form id="signup-form">

                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input
                        type="email"
                        id="email"
                        placeholder="name@example.com"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="password">Password</label>

                    <div class="password-wrapper">
                        <input
                            type="password"
                            id="password"
                            placeholder="Create a password"
                            minlength="6"
                            autocomplete="new-password"
                            required
                        >

                        <button
                            type="button"
                            class="toggle-password"
                            data-target="password"
                            aria-label="Show password"
                            aria-pressed="false"
                        >
                            <svg viewBox="0 0 24 24" aria-hidden="true">
                                <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"></path>
                                <circle cx="12" cy="12" r="3"></circle>
                            </svg>
                        </button>
                    </div>

                    <small>Use at least 6 characters.</small>
                </div>

                <div class="form-group">
                    <label for="confirm-password">Confirm Password</label>

                    <div class="password-wrapper">
                        <input
                            type="password"
                            id="confirm-password"
                            placeholder="Enter your password again"
                            minlength="6"
                            autocomplete="new-password"
                            required
                        >

                        <button
                            type="button"
                            class="toggle-password"
                            data-target="confirm-password"
                            aria-label="Show password"
                            aria-pressed="false"
                        >
                            <svg viewBox="0 0 24 24" aria-hidden="true">
                                <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"></path>
                                <circle cx="12" cy="12" r="3"></circle>
                            </svg>
                        </button>
                    </div>
                </div>

                <p id="error-message" class="message"></p>

                <button type="submit" id="signup-button">
                    Create Account <span>→</span>
                </button>

            </form>

            <div class="signup-footer">
                <p>Already have an account?</p>
                <a href="login.html">Log In</a>
            </div>

        </section>

        <p class="signup-note">YOUR DAY. YOUR PLAN. YOUR PRODUCTIVITY.</p>

    </main>

    <!-- PASSWORD VISIBILITY -->
    <script>
        document.querySelectorAll(".toggle-password").forEach(button => {

            button.addEventListener("click", function () {

                const input = document.getElementById(
                    this.dataset.target
                );

                const isHidden = input.type === "password";

                input.type = isHidden ? "text" : "password";

                this.setAttribute(
                    "aria-label",
                    isHidden ? "Hide password" : "Show password"
                );

                this.setAttribute(
                    "aria-pressed",
                    isHidden ? "true" : "false"
                );

                if (isHidden) {
                    this.innerHTML = `
                        <svg viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M3 3l18 18"></path>
                            <path d="M10.6 10.6a2 2 0 0 0 2.8 2.8"></path>
                            <path d="M9.9 5.2A10.8 10.8 0 0 1 12 5c6.5 0 10 7 10 7a13.5 13.5 0 0 1-3 3.8"></path>
                            <path d="M6.2 6.2C3.5 8 2 12 2 12s3.5 7 10 7a10.8 10.8 0 0 0 4.1-.8"></path>
                        </svg>
                    `;
                } else {
                    this.innerHTML = `
                        <svg viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"></path>
                            <circle cx="12" cy="12" r="3"></circle>
                        </svg>
                    `;
                }

            });

        });
    </script>

    <!-- FIREBASE SIGN UP -->
    <script type="module" src="signup.js"></script>

</body>
</html>
