
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up | Daily Planner</title>
    <link rel="stylesheet" href="login.css">
</head>
<body class="signup-page">

    <main class="signup-container">

        <section class="signup-card">

            <div class="signup-brand">
                <div class="signup-icon">📅</div>
                <h1>Daily Planner</h1>
                <p>Organize your day, one task at a time.</p>
            </div>

            <div class="signup-heading">
                <span class="signup-label">GET STARTED</span>
                <h2>Create Account</h2>
                <p>Create your account and start planning your day.</p>
            </div>

            <form id="signup-form">

                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input
                        type="email"
                        id="email"
                        placeholder="name@example.com"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input
                        type="password"
                        id="password"
                        placeholder="Create a password"
                        minlength="6"
                        required
                    >
                    <small>Use at least 6 characters.</small>
                </div>

                <div class="form-group">
                    <label for="confirm-password">Confirm Password</label>
                    <input
                        type="password"
                        id="confirm-password"
                        placeholder="Enter your password again"
                        minlength="6"
                        required
                    >
                </div>

                <p id="error-message" class="message"></p>

                <button type="submit" id="signup-button">
                    Create Account <span>→</span>
                </button>

            </form>

            <div class="signup-footer">
                <p>Already have an account?</p>
                <a href="login.html">Log In</a>
            </div>

        </section>

        <p class="signup-note">YOUR DAY. YOUR PLAN. YOUR PRODUCTIVITY.</p>

    </main>

    <script type="module" src="signup.js"></script>

</body>
</html>
